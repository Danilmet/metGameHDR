name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/metGameHUB -c Release -o out/fd -p:Version=$v -p:DebugType=none
          dotnet publish src/metGameHUB -c Release -o out/sc -p:Version=$v -p:DebugType=none --self-contained -p:IncludeNativeLibrariesForSelfExtract=true
          Compress-Archive -Path out/fd/* -DestinationPath "metGameHUB-$v-win-x64.zip"
          Compress-Archive -Path out/sc/* -DestinationPath "metGameHUB-$v-win-x64-selfcontained.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem *.zip) --generate-notes
